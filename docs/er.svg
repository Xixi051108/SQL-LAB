<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="960" viewBox="0 0 1320 960" role="img" aria-labelledby="title desc">
<title id="title">智能 SQL 考试系统中文实体关系图</title><desc id="desc">用户创建题目和考试，学生参加考试产生作答，考试通过考试题目组卷，作答包含每道考试题目的答案。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#708da8" stroke-width="1.2"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#29485f}.title{font-size:29px;font-weight:600}.sub{font-size:14px;fill:#7891a5}.head{font-size:20px;font-weight:600;fill:white}.field{font-size:16px}.hint{font-size:12px;fill:#7d94a7}.edge{fill:none;stroke:#8ca4b7;stroke-width:1.7;marker-end:url(#arrow)}.label{font-size:14px;fill:#406b8b;paint-order:stroke;stroke:#f4f8fc;stroke-width:7px;stroke-linejoin:round}.box{fill:white;stroke:#d3e0eb;stroke-width:1.5}.pk{fill:#168575;font-weight:600}</style>
<rect width="1320" height="960" fill="#f4f8fc"/><text x="60" y="55" class="title">智能 SQL 考试系统实体关系图</text><text x="60" y="85" class="sub">六类核心实体 · 箭头从“一”指向“多” · 每场考试每位学生只有一份作答</text>
<path class="edge" d="M360 265H500"/><text x="392" y="250" class="label">创建 1:N</text>
<path class="edge" d="M210 170V125H1090V170"/><text x="563" y="116" class="label">创建题目 1:N</text>
<path class="edge" d="M210 400V570"/><text x="228" y="498" class="label">参加 1:N</text>
<path class="edge" d="M650 400V488H285V570"/><text x="430" y="478" class="label">产生作答 1:N</text>
<path class="edge" d="M800 310H865V515H1000V570"/><text x="875" y="435" class="label">包含题目 1:N</text>
<path class="edge" d="M1090 400V570"/><text x="1108" y="493" class="label">被选入 1:N</text>
<path class="edge" d="M360 680H500"/><text x="385" y="665" class="label">包含 1:N</text>
<path class="edge" d="M940 680H800"/><text x="825" y="665" class="label">对应 1:N</text>
<g transform="translate(60 170)"><rect class="box" width="300" height="230" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#183d62"/><text x="22" y="33" class="head">用户</text><text x="22" y="82" class="field pk">用户编号（主键）</text><text x="22" y="113" class="field">用户名（唯一）、姓名</text><text x="22" y="144" class="field">密码摘要、角色</text><text x="22" y="175" class="field">创建时间</text><text x="22" y="208" class="hint">角色：教师 / 学生</text></g>
<g transform="translate(500 170)"><rect class="box" width="300" height="230" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#183d62"/><text x="22" y="33" class="head">考试</text><text x="22" y="82" class="field pk">考试编号（主键）</text><text x="22" y="113" class="field">名称、开始时间、结束时间</text><text x="22" y="144" class="field">发布状态、创建时间</text><text x="22" y="175" class="field">创建教师编号（外键）</text><text x="22" y="208" class="hint">结束时间晚于开始时间</text></g>
<g transform="translate(940 170)"><rect class="box" width="300" height="230" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#183d62"/><text x="22" y="33" class="head">题目</text><text x="22" y="82" class="field pk">题目编号（主键）</text><text x="22" y="113" class="field">标题、题型、题干、目标表</text><text x="22" y="144" class="field">参考语句、解析、排序要求</text><text x="22" y="175" class="field">来源、审核状态、创建时间</text><text x="22" y="208" class="hint">创建教师编号（外键）</text></g>
<g transform="translate(60 570)"><rect class="box" width="300" height="245" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#168575"/><text x="22" y="33" class="head">作答</text><text x="22" y="82" class="field pk">作答编号（主键）</text><text x="22" y="113" class="field">考试编号、学生编号（外键）</text><text x="22" y="144" class="field">状态、开始时间、交卷时间</text><text x="22" y="175" class="field">总分、异常说明</text><text x="22" y="211" class="hint">考试编号 + 学生编号联合唯一</text></g>
<g transform="translate(500 570)"><rect class="box" width="300" height="245" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#168575"/><text x="22" y="33" class="head">答案</text><text x="22" y="82" class="field pk">答案编号（主键）</text><text x="22" y="113" class="field">作答编号、考试题目编号</text><text x="22" y="144" class="field">答案语句、保存时间</text><text x="22" y="175" class="field">得分、判定、反馈</text><text x="22" y="211" class="hint">两项外键联合唯一，避免重复答案</text></g>
<g transform="translate(940 570)"><rect class="box" width="300" height="245" rx="12"/><path d="M12 0H288Q300 0 300 12V50H0V12Q0 0 12 0" fill="#168575"/><text x="22" y="33" class="head">考试题目</text><text x="22" y="82" class="field pk">考试题目编号（主键）</text><text x="22" y="113" class="field">考试编号、题目编号（外键）</text><text x="22" y="144" class="field">题序、分值、题目快照</text><text x="22" y="175" class="field">同卷题序唯一，同卷题目唯一</text><text x="22" y="211" class="hint">题库题目删除时保留已发布快照</text></g>
<text x="60" y="883" class="sub">完整性：主键标识实体，外键维持关联，唯一约束防止重复作答；发布时保存题目快照以保留历史语义。</text><text x="60" y="913" class="sub">会话表用于登录状态持久化，属于辅助技术表；教学练习库独立于上述业务实体。</text>
</svg>
